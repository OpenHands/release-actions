name: bump-consumers

# Pins every consumer repo's `uses: OpenHands/release-actions/...@<ref>` to a
# released tag of THIS repo, and opens a `chore(deps): ...` PR in each one.
#
# Runs automatically when this repo publishes a release, and can be dispatched
# manually to pin a specific version, target a subset of repos, or dry-run.
#
# Auth: mints the shared release App token (RELEASE_APP_ID /
# RELEASE_APP_PRIVATE_KEY, already org-level secrets), scoped to one target repo
# at a time. There is deliberately no GITHUB_TOKEN fallback: GITHUB_TOKEN cannot
# write to another repo, and a PR it opened would not trigger the target repo's
# required checks.
#
# PERMISSION PREREQUISITE (read before deploying): the refs we rewrite live under
# .github/workflows/ in the target repo, and an App installation token can only
# push workflow-file changes if the App has "Workflows: write". The shared
# release App therefore needs Contents + Pull requests + **Workflows** read/write
# on every target below (org-wide is fine). Without it the push fails on each
# target with `refusing to allow a GitHub App to create or update workflow`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to pin consumers to (e.g. v0.3.0). Defaults to this repo''s latest published release.'
        required: false
        type: string
      repos:
        description: 'Newline- or comma-separated owner/name targets. Defaults to the full consumer list in the workflow env.'
        required: false
        type: string
      dry-run:
        description: 'Print the rewritten refs without opening PRs.'
        required: false
        default: false
        type: boolean

# Jobs opt in individually; nothing gets ambient write scope.
permissions: {}

# One fan-out at a time. Two releases landing back-to-back must not race each
# other into the same consumer branch. Don't cancel: a running bump should finish.
concurrency:
  group: bump-consumers
  cancel-in-progress: false

env:
  # Default fan-out targets: every repo in the org that calls a reusable workflow
  # from this one. Deliberately NOT auto-discovered — code search misses repos
  # while its index lags, and a silently short list looks like a successful run.
  #
  # Excluded on purpose:
  #   OpenHands/freeze-on-ready-test  — pins a feature-branch SHA as its whole point.
  #   OpenHands/release-actions       — this repo; releases itself via local `./` refs.
  DEFAULT_CONSUMERS: |
    OpenHands/OpenHands
    OpenHands/OpenHands-Cloud
    OpenHands/agent-canvas
    OpenHands/automation
    OpenHands/extensions
    OpenHands/integrations-hub
    OpenHands/plugin-directory
    OpenHands/release-actions-validation
    OpenHands/runtime-api
    OpenHands/service-template
    OpenHands/typescript-client

jobs:
  plan:
    # Skip drafts and pre-releases; a manual dispatch is always honoured.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      repos: ${{ steps.targets.outputs.repos }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "release" ]; then
            version="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(gh release view --repo "$REPO" --json tagName --jq .tagName)"
            echo "No version given; using latest release: $version"
          fi

          # Reject anything that isn't a plain SemVer tag. Pinning every consumer
          # in the org to a typo'd or non-existent ref would break each of their
          # release pipelines at once, so this is a hard gate, not a nicety.
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a vX.Y.Z tag" >&2
            exit 1
          fi

          if ! gh api "repos/$REPO/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "::error::tag '$version' does not exist in $REPO" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build target matrix
        id: targets
        env:
          INPUT_REPOS: ${{ inputs.repos }}
          DEFAULT_CONSUMERS: ${{ env.DEFAULT_CONSUMERS }}
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys

          raw = os.environ.get("INPUT_REPOS", "").strip() or os.environ["DEFAULT_CONSUMERS"]
          repos, seen = [], set()
          for item in re.split(r"[,\n]", raw):
              item = item.strip()
              if not item or item in seen:
                  continue
              if not re.fullmatch(r"[A-Za-z0-9._-]+/[A-Za-z0-9._-]+", item):
                  print(f"::error::'{item}' is not a valid owner/name target", file=sys.stderr)
                  raise SystemExit(1)
              seen.add(item)
              repos.append(item)

          if not repos:
              print("::error::no target repositories resolved", file=sys.stderr)
              raise SystemExit(1)

          print(f"repos={json.dumps(repos)}")
          print(f"count={len(repos)}")
          PY

      - name: Summary
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          COUNT: ${{ steps.targets.outputs.count }}
          REPOS: ${{ steps.targets.outputs.repos }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          {
            echo "## Bumping consumers to \`$VERSION\`"
            echo
            echo "Targets: **$COUNT**${DRY_RUN:+ (dry-run: \`$DRY_RUN\`)}"
            echo
            printf '%s' "$REPOS" | python3 -c 'import json,sys; [print(f"- `{r}`") for r in json.load(sys.stdin)]'
          } >> "$GITHUB_STEP_SUMMARY"

  bump:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # We act on the target repo exclusively via the App token minted below,
    # never via this workflow's GITHUB_TOKEN, so the job needs no permissions.
    permissions: {}
    strategy:
      # One unreachable repo (App not installed, branch protected, ...) must not
      # strand the other ten.
      fail-fast: false
      max-parallel: 4
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - name: Parse target repo
        id: target
        env:
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET#*/}" >> "$GITHUB_OUTPUT"

      # Scoped to this one repo: a token that could write to all eleven is a
      # much worse thing to leak than eleven single-repo tokens.
      - name: Mint GitHub App token (scoped to the target repo)
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Checkout target repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Rewrite release-actions refs
        id: rewrite
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          # Values reach the script through the environment, never through
          # expression interpolation into the source — a tag name is
          # attacker-shaped input. (Don't write a literal empty expression in
          # this block either: `run:` is interpolated before the shell sees it.)
          python3 <<'PY'
          import os, pathlib, re

          version = os.environ["VERSION"]

          # Anchored on the `uses:` key, so commented-out examples and prose
          # mentions of release-actions in the same file are left alone.
          LINE = re.compile(
              r'^(?P<head>\s*uses:\s*)'
              r'(?P<q>["\']?)'
              r'(?P<action>OpenHands/release-actions(?:/[^@\s"\']*)?)'
              r'@(?P<ref>[^\s"\']+)'
              r'(?P=q)(?P<tail>.*)$'
          )

          changed, unchanged = [], []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              text = path.read_text(encoding="utf-8")
              out = []
              hit = False
              for line in text.splitlines(keepends=True):
                  m = LINE.match(line.rstrip("\n"))
                  if not m:
                      out.append(line)
                      continue
                  if m["ref"] == version:
                      unchanged.append(f"{path}: already @{version}")
                      out.append(line)
                      continue
                  eol = "\n" if line.endswith("\n") else ""
                  out.append(
                      f'{m["head"]}{m["q"]}{m["action"]}@{version}{m["q"]}{m["tail"]}{eol}'
                  )
                  changed.append(f'{path}: @{m["ref"]} -> @{version}')
                  hit = True
              if hit:
                  path.write_text("".join(out), encoding="utf-8")

          for line in changed or unchanged:
              print(line)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"changed={'true' if changed else 'false'}\n")
              fh.write(f"count={len(changed)}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### `{os.environ['TARGET']}`\n\n")
              if changed:
                  fh.write("```\n" + "\n".join(changed) + "\n```\n")
              else:
                  fh.write(f"No change — already pinned to `{version}`.\n")
          PY

      - name: Show diff (dry run)
        if: ${{ inputs.dry-run && steps.rewrite.outputs.changed == 'true' }}
        run: git --no-pager diff

      - name: Open pull request
        id: cpr
        if: ${{ !inputs.dry-run && steps.rewrite.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Commit only the workflow files we rewrote — never anything else the
          # runner may have touched.
          add-paths: .github/workflows
          # A rolling branch: if a bump PR is still open when the next release
          # lands, it advances to the newer tag instead of piling up PRs.
          branch: chore/bump-release-actions
          delete-branch: true
          # Conventional Commit title, so the target repo's own pr-title lint
          # passes and release-please folds it in under `type: chore`.
          commit-message: 'chore(deps): bump release-actions to ${{ needs.plan.outputs.version }}'
          title: 'chore(deps): bump release-actions to ${{ needs.plan.outputs.version }}'
          labels: automated
          body: |
            Pins this repo's `uses: OpenHands/release-actions/...` references to
            **${{ needs.plan.outputs.version }}**.

            |           |                                                                                          |
            | --------- | ---------------------------------------------------------------------------------------- |
            | Version   | [`${{ needs.plan.outputs.version }}`](https://github.com/OpenHands/release-actions/releases/tag/${{ needs.plan.outputs.version }}) |
            | Refs updated | ${{ steps.rewrite.outputs.count }} |

            Opened by the [`bump-consumers`](https://github.com/OpenHands/release-actions/actions/workflows/bump-consumers.yml)
            workflow in `OpenHands/release-actions`. Review the release notes before merging.

      - name: Report
        if: ${{ always() && steps.rewrite.outcome == 'success' }}
        env:
          TARGET: ${{ matrix.repo }}
          CHANGED: ${{ steps.rewrite.outputs.changed }}
          URL: ${{ steps.cpr.outputs.pull-request-url }}
          OP: ${{ steps.cpr.outputs.pull-request-operation }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "$TARGET: already up to date"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "$TARGET: dry run, no PR opened"
          else
            echo "$TARGET: PR ${OP}: ${URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
