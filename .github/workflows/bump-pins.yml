name: bump-pins (reusable)

# Reusable workflow: keeps one pull request open that moves the caller's
# dependency pins (an upstream SDK, a sibling service, a shared package) to the
# latest releases published on PyPI / npm.
#
# The split: this workflow resolves the versions, waits for a release that was
# only just published, and owns the branch, the commit and the pull request. The
# caller says which packages it pins and gives the command that writes a version
# into its own files and lockfile.
#
# The caller owns the trigger (see the README):
#
#   on:
#     workflow_dispatch:
#     schedule:
#       - cron: '17 * * * *'
#   jobs:
#     bump-pins:
#       secrets: inherit
#       uses: OpenHands/release-actions/.github/workflows/bump-pins.yml@main
#       with:
#         pins: SDK=pypi:openhands-sdk
#         title: 'fix: bump SDK to {SDK}'
#         uv: true
#         command: |
#           sed -i -E 's/"openhands-sdk==[^"]*"/"openhands-sdk=='"$PIN_SDK"'"/' pyproject.toml
#           uv lock
on:
  workflow_call:
    inputs:
      pins:
        description: >-
          One `NAME=<registry>:<package>` line per pin; registries are `pypi` and
          `npm`. Each resolves to the latest stable release and reaches the
          command as PIN_<NAME>. `NAME=pypi:<package> required-by OTHER` instead
          resolves to the version that pin OTHER's release requires with `==`.
        required: true
        type: string
      command:
        description: >-
          Shell command run in the repository root, on the default branch, with
          the PIN_<NAME> variables set. It writes the versions into the repository
          (manifest, lockfile); every file it changes is committed.
        required: true
        type: string
      title:
        description: >-
          Conventional Commit subject, used for the commit and the pull request.
          `{NAME}` is replaced by that pin's version. Use a type that cuts a
          release (`fix:`) when a release must follow the bump.
        required: true
        type: string
      expect:
        description: >-
          Optional `NAME=X.Y.Z` lines, for a run dispatched right after a
          publish: wait until each of those pins resolves to that release (or a
          newer one) instead of acting on the previous one.
        required: false
        type: string
        default: ''
      wait-minutes:
        description: How long to wait for the `expect` releases before failing.
        required: false
        type: number
        default: 20
      branch:
        description: Rolling branch the pull request is opened from; this workflow owns it.
        required: false
        type: string
        default: bump-pins
      node-version:
        description: Node.js version for the command (and for this workflow's own scripts).
        required: false
        type: string
        default: '20'
      uv:
        description: Install uv for the command.
        required: false
        type: boolean
        default: false
      dry-run:
        description: Resolve, run the command and show the commit, but push nothing.
        required: false
        type: boolean
        default: false
    secrets:
      RELEASE_APP_ID:
        description: 'App ID of the shared release GitHub App. Pass it with `secrets: inherit`.'
        required: true
      RELEASE_APP_PRIVATE_KEY:
        description: 'Private key of that App. Pass it with `secrets: inherit`.'
        required: true
    outputs:
      versions:
        description: JSON object of the resolved pins, e.g. {"SDK":"1.63.0"}.
        value: ${{ jobs.bump-pins.outputs.versions }}
      changed:
        description: '"true" if the pins differ from the default branch.'
        value: ${{ jobs.bump-pins.outputs.changed }}
      pull-request-url:
        description: URL of the open pull request (empty when nothing changed or on a dry run).
        value: ${{ jobs.bump-pins.outputs.pull-request-url }}

# One run per branch at a time, so two releases published close together cannot
# race to push. Don't cancel: a run that is pushing should finish.
concurrency:
  group: bump-pins-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

# Everything is done with the App token minted below.
permissions: {}

jobs:
  bump-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      versions: ${{ steps.bump.outputs.versions }}
      changed: ${{ steps.bump.outputs.changed }}
      pull-request-url: ${{ steps.bump.outputs.pull-request-url }}
    steps:
      # An App token, not GITHUB_TOKEN: GitHub starts no workflows for events
      # created with GITHUB_TOKEN, so the pull request's required checks would
      # never run. There is no fallback; missing App secrets fail the run.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Asked from the API: a scheduled run's event payload does not carry it.
      - name: Find the default branch
        id: repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "default-branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" >> "$GITHUB_OUTPUT"

      # Always the default branch, whatever ref the caller was dispatched on. The
      # token is not kept in the checkout, so the command below cannot read it.
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.repo.outputs.default-branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up uv
        if: ${{ inputs.uv }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      # Pinned at @main (action `uses:` refs must be literal), like the
      # release-please action: callers that pin this workflow at @main get
      # matching scripts.
      - name: Bump pins
        id: bump
        uses: OpenHands/release-actions/scripts/bump-pins@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          pins: ${{ inputs.pins }}
          command: ${{ inputs.command }}
          title: ${{ inputs.title }}
          base: ${{ steps.repo.outputs.default-branch }}
          branch: ${{ inputs.branch }}
          expect: ${{ inputs.expect }}
          wait-minutes: ${{ inputs.wait-minutes }}
          dry-run: ${{ inputs.dry-run }}

      - name: Summary
        env:
          VERSIONS: ${{ steps.bump.outputs.versions }}
          CHANGED: ${{ steps.bump.outputs.changed }}
          URL: ${{ steps.bump.outputs.pull-request-url }}
        run: |
          {
            echo "Resolved pins: \`${VERSIONS}\`"
            if [ "$CHANGED" != "true" ]; then
              echo "The default branch already has them."
            elif [ -n "$URL" ]; then
              echo "Pull request: ${URL}"
            else
              echo "Dry run: nothing was pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
